name: karthikeya-independent-lab
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab}
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env.local first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - lab_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 3s
      timeout: 3s
      retries: 30
  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Generate .env.local first}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Generate .env.local first}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - lab_objects:/data
volumes:
  lab_database:
  lab_objects:
